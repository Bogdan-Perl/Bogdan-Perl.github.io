<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noble: Learn World History</title>
<meta name="description" content="World history in five-minute illustrated stories. Read them or listen, then lock it in with a few quick questions. Free on iPhone.">
<meta name="theme-color" content="#2C4744">
<meta name="apple-itunes-app" content="app-id=6768127748">
<meta property="og:title" content="Noble: Learn World History">
<meta property="og:description" content="Screen time, well spent. Five-minute illustrated history stories with a narrator. Free on iPhone.">
<meta property="og:image" content="https://bogdan-perl.github.io/Noble/img/og.jpg">
<meta property="og:url" content="https://bogdan-perl.github.io/Noble/">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<style>
  :root { --teal: #2C4744; --teal-deep: #1B2D2B; --gold: #E2BE62; --cream: #F6EFD9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100svh;
    background: linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%);
    color: var(--cream); text-align: center;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(18px + env(safe-area-inset-top)) 18px calc(10px + env(safe-area-inset-bottom));
  }
  .top { flex: 0 0 auto; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; letter-spacing: .03em; opacity: .9; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  h1 {
    font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
    font-weight: 700; font-size: clamp(30px, 8.5vw, 46px); line-height: 1.05; margin: 14px 0 10px;
  }
  h1 em { font-style: normal; color: var(--gold); }
  .lede { max-width: 26em; margin: 0 auto 16px; font-size: 15px; opacity: .9; }
  .badge { display: inline-block; line-height: 0; }
  .badge img { height: 54px; width: auto; }
  .free { margin: 8px 0 0; font-size: 13px; opacity: .75; }
  /* Three screenshots side by side, each as large as the space allows:
     a third of the width, or the free height (screenshots are 1320x2868). */
  .shots {
    flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: center;
    gap: 10px; padding-top: 16px; container-type: size;
  }
  .shots img {
    width: min(calc((100cqw - 20px) / 3), calc(100cqh * 0.4602), 200px); height: auto;
    border-radius: 12px; box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  footer { flex: 0 0 auto; font-size: 12px; padding-top: 10px; opacity: .7; }
  footer a { color: var(--cream); }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="img/icon.png" alt="" width="40" height="40">Noble: Learn World History</div>
  <h1>Screen time,<br><em>well spent.</em></h1>
  <p class="lede">World history in five-minute illustrated stories. Read or listen, then lock it in with a few quick questions.</p>
  <a class="badge store-link" href="https://apps.apple.com/app/id6768127748">
    <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store">
  </a>
  <p class="free">Free on iPhone</p>
</div>

<div class="shots" aria-label="App screenshots">
  <img src="img/01-timeline.jpg" alt="The timeline of lessons in Noble">
  <img src="img/02-lesson.jpg" alt="A painted lesson page">
  <img src="img/03-questions.jpg" alt="A quick question about the lesson">
</div>

<footer>
  <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a> &middot; <a href="support.html">Support</a>
</footer>

<script>
(function () {
  // Filled in on launch day: the App Store Connect provider token (pt) and the Meta Pixel id.
  var PROVIDER_TOKEN = "";
  var PIXEL_ID = "2065784714137116";
  var APP_ID = "6768127748";

  // Each ad opens this page as ...?c=<token>; the token becomes the App Store campaign (ct)
  // so App Store Connect can count downloads per ad concept.
  var c = "web";
  try {
    var q = new URLSearchParams(location.search).get("c");
    if (q && /^[a-z0-9_]{1,30}$/.test(q)) c = q;
  } catch (e) {}

  var storeURL = PROVIDER_TOKEN
    ? "https://apps.apple.com/app/apple-store/id" + APP_ID + "?pt=" + encodeURIComponent(PROVIDER_TOKEN) + "&ct=" + encodeURIComponent(c) + "&mt=8"
    : "https://apps.apple.com/app/id" + APP_ID;

  if (PIXEL_ID) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', PIXEL_ID);
    fbq('track', 'PageView');
  }

  var links = document.querySelectorAll('.store-link');
  for (var i = 0; i < links.length; i++) {
    links[i].href = storeURL;
    links[i].addEventListener('click', function () {
      try { if (window.fbq) fbq('trackCustom', 'AppStoreClick', { campaign: c }); } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
